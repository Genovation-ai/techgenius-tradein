# Railway / Nixpacks build plan for the Gadget Swap trade-in platform.
# The service is a Node app (admin portal + widget bundle + Express API)
# that shells out to a Python scraper for competitor prices. Both runtimes
# need to be present at run time, and Playwright's chromium headless shell
# needs to be fetched during build so the scraper starts without a cold
# download on the first request.

providers = ["node", "python"]

[phases.setup]
# The `python` provider already brings a Python derivation (with pip) into
# the environment, so we only add Node here. Listing `python3` as an extra
# nixPkg was the 2nd failure cause: Nixpacks' provider-default python3 and
# the explicit python3 both ship `lib/pkgconfig/python3-embed.pc`, and Nix
# refuses to merge environments with the same file from two store paths.
# The first failure was the same collision between python311 and
# python311Packages.pip — pip is inside python311 already.
nixPkgs = ["nodejs_20"]

[phases.install]
# Node install happens via the default npm phase; add the python side on top.
cmds = [
  "npm ci --no-audit --no-fund",
  "python -m pip install --no-cache-dir -r requirements.txt",
]

[phases.build]
cmds = [
  "npm run build",
]

[start]
cmd = "npm start"
